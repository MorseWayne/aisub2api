[package]
name = "aisub2api-cli"
version.workspace = true
edition.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "aisub2api"
path = "src/main.rs"

[dependencies]
aisub2api-config = { path = "../aisub2api-config" }
aisub2api-core = { path = "../aisub2api-core" }
aisub2api-providers = { path = "../aisub2api-providers" }
aisub2api-server = { path = "../aisub2api-server" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
dialoguer = "0.11"
colored = "3"
ratatui = "0.30"
crossterm = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking", "socks", "hickory-dns"] }

[target.'cfg(unix)'.dependencies]
daemonize = "0.5"
libc = "0.2"
