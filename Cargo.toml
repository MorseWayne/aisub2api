[workspace]
resolver = "2"
members = [
    "crates/aisub2api-config",
    "crates/aisub2api-core",
    "crates/aisub2api-providers",
    "crates/aisub2api-server",
    "crates/aisub2api-cli",
]

[workspace.package]
version = "6.0.1"
edition = "2024"
description = "Turn AI subscriptions into Anthropic- and OpenAI-compatible APIs"
license = "MIT"
repository = "https://github.com/MorseWayne/aisub2api"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
